interface:
  display_name: "Mining Host Troubleshooter"
  short_description: "Read-only Linux compromise and mining diagnostics with detailed evidence correlation"
  default_prompt: "Investigate this Linux host in read-only mode only. Respect any requested focus such as intrusion, mining, malware, persistence, or local privilege escalation review. Detect distro and version first, pivot correctly when logs are missing, reconstruct attacker behavior from evidence only, keep confidence and traceability explicit, and never execute state-changing commands unless the user explicitly authorizes a separate follow-up step."
