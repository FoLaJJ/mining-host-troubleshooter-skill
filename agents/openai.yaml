interface:
  display_name: "Mining Host Troubleshooter"
  short_description: "Read-only Linux compromise and mining diagnostics with detailed evidence correlation"
  default_prompt: >-
    Investigate this Linux host in read-only mode only. Respect any requested
    focus such as intrusion, mining, malware, persistence, or local privilege
    escalation review. Detect distro and version first, pivot correctly when
    logs are missing, and verify command trust before relying on suspicious core
    command output. Run a mandatory second-pass self-review before final
    reporting: re-check timeline quality, scope closure, distro-aware log
    layout, false-positive risks, and required external pivots. Keep primary
    conclusions conservative: separate
    observed_fact, inference, and attribution; require concrete evidence IDs for
    every key conclusion; treat weak clues as inconclusive investigative leads;
    use conservative remote-auth fallback, stopping immediately on credential
    failure or host-key mismatch; if host-side collection fails, still export a
    degraded failure bundle and reports inside the current case directory;
    treat dual-use remote-control tools as observed presence unless abnormal
    authorization, path, startup, or timeline evidence supports suspicious use;
    treat missing logs as visibility loss unless corroborated; treat vulnerable
    versions as exposure rather than confirmed exploitation; reconstruct
    attacker behavior from evidence only; and never execute state-changing
    commands unless the user explicitly authorizes a separate follow-up step.
